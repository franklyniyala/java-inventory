sonar.projectKey=java-inventory
sonar.projectName=Java Inventory Application
sonar.sourceEncoding=UTF-8

# Application source directories
sonar.sources=backend/src/main/java,frontend/src

# Test directories
sonar.tests=backend/src/test/java,frontend/src/__tests__

# Test file identification
sonar.test.inclusions=**/*Test.java,**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx

# Exclude generated and non-source files
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/test-setup.js,frontend/src/__tests__/**

# Java code coverage
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend JavaScript coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
